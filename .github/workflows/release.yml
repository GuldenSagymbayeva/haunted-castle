name: Release

# Push a tag such as v1.0.0 to build the jar and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/haunted-castle.jar
          generate_release_notes: true
